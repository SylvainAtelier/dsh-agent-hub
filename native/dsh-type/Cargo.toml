[package]
name = "dsh-type"
version = "0.1.0"
edition = "2021"
description = "Types dictated text into the front app for dsh-agent-hub's Cardputer module"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.9"
png = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
